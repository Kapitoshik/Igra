<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Лопни шарики DELUXE</title>
  <script src="https://max.ru" defer></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 5; gap: 8px; }
    .pill { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 8px 14px; border-radius: 14px; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    #comboBox { color: #ffca3a; border-color: rgba(255, 202, 58, 0.4); opacity: 0; transition: opacity 0.2s, transform 0.15s; }
    #comboBox.show { opacity: 1; transform: scale(1.05); }
    #soundBtn { pointer-events: auto; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; width: 42px; height: 42px; border-radius: 50%; font-size: 18px; cursor: pointer; }
    #overlay { position: absolute; inset: 0; z-index: 20; background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    h1 { margin: 0 0 8px; font-size: 32px; background: linear-gradient(90deg, #60a5fa, #f472b6, #facc15); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .badge { background: rgba(255, 202, 58, 0.15); color: #ffca3a; border: 1px solid rgba(255, 202, 58, 0.35); padding: 6px 18px; border-radius: 20px; margin-bottom: 16px; font-weight: 700; font-size: 15px; }
    .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 340px; margin-bottom: 22px; }
    .tag { background: rgba(255, 255, 255, 0.07); padding: 6px 10px; border-radius: 10px; font-size: 13px; color: #cbd5e1; }
    .row { display: flex; gap: 8px; margin-bottom: 24px; }
    .diff { background: rgba(255, 255, 255, 0.08); color: #94a3b8; border: 2px solid transparent; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .diff.active { background: rgba(59, 130, 246, 0.25); border-color: #3b82f6; color: #fff; }
    #startBtn { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: #fff; border: none; padding: 16px 48px; font-size: 18px; font-weight: 700; border-radius: 16px; box-shadow: 0 8px 25px rgba(37, 99, 235, 0.45); cursor: pointer; }
    #startBtn:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div id="hud">
    <div class="pill">💎 <span id="score">0</span></div>
    <div class="pill" id="comboBox">🔥 x<span id="comboVal">1</span></div>
    <div class="pill" id="timePill">⏱ <span id="time">30</span>с</div>
    <button id="soundBtn" type="button">🔊</button>
  </div>

  <canvas id="c"></canvas>

  <div id="overlay">
    <h1 id="title">Лопни шарики</h1>
    <div class="badge">🏆 Рекорд: <span id="best">0</span></div>
    <div class="legend" id="sub">
      <div class="tag">🎈 Шар +1/+2</div>
      <div class="tag">⭐ Золотой +5</div>
      <div class="tag">❄️ Лёд +3с и замедление</div>
      <div class="tag">💣 Бомба -5</div>
    </div>
    <div class="row">
      <button type="button" class="diff" data-d="easy">Лёгкий</button>
      <button type="button" class="diff active" data-d="normal">Средний</button>
      <button type="button" class="diff" data-d="hard">Сложный</button>
    </div>
    <button id="startBtn" type="button">Играть</button>
  </div>

  <script>
    var tg = null;
    window.onload = function() {
      try {
        tg = window.WebApp || null;
        if (tg && tg.ready) tg.ready();
        if (tg && tg.enableClosingConfirmation) tg.enableClosingConfirmation();
      } catch (e) {}
    };

    function vibro(t) {
      try {
        if (!tg || !tg.HapticFeedback) return;
        if (t === 'err' && tg.HapticFeedback.notificationOccurred) tg.HapticFeedback.notificationOccurred('error');
        else if (t === 'ok' && tg.HapticFeedback.notificationOccurred) tg.HapticFeedback.notificationOccurred('success');
        else if (tg.HapticFeedback.impactOccurred) tg.HapticFeedback.impactOccurred(t);
      } catch (e) {}
    }

    var c = document.getElementById('c');
    var ctx = c.getContext('2d');
    var scoreEl = document.getElementById('score');
    var timeEl = document.getElementById('time');
    var timePill = document.getElementById('timePill');
    var bestEl = document.getElementById('best');
    var comboBox = document.getElementById('comboBox');
    var comboVal = document.getElementById('comboVal');
    var overlay = document.getElementById('overlay');
    var titleEl = document.getElementById('title');
    var subEl = document.getElementById('sub');
    var startBtn = document.getElementById('startBtn');
    var soundBtn = document.getElementById('soundBtn');
    var diffs = document.querySelectorAll('.diff');

    var w = 360, h = 640, items = [], parts = [], texts = [], stars = [];
    var score = 0, best = 0, time = 30, combo = 0, freeze = 0, shake = 0;
    var playing = false, timer = 0, iv = null, raf = null, sound = true, mode = 'normal';

    try { best = Number(localStorage.getItem('b_best')) || 0; } catch (e) {}
    bestEl.textContent = best;

    var cfgMap = {
      easy: { rate: 25, spd: 0.85, bomb: 0.10 },
      normal: { rate: 19, spd: 1.2, bomb: 0.18 },
      hard: { rate: 14, spd: 1.6, bomb: 0.27 }
    };
    var pals = [
      ['#ff758f', '#c9184a'],
      ['#4cc9f0', '#4361ee'],
      ['#80ed99', '#38b000'],
      ['#f72585', '#7209b7'],
      ['#ff9e00', '#ff5400']
    ];

    for (var i = 0; i < diffs.length; i++) {
      diffs[i].onclick = function() {
        for (var j = 0; j < diffs.length; j++) diffs[j].className = 'diff';
        this.className = 'diff active';
        mode = this.getAttribute('data-d');
      };
    }

    soundBtn.onclick = function() {
      sound = !sound;
      soundBtn.textContent = sound ? '🔊' : '🔇';
    };

    var ac = null;
    function beep(f1, f2, dur, type) {
      if (!sound) return;
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!ac) ac = new AC();
        if (ac.state === 'suspended') ac.resume();
        var o = ac.createOscillator();
        var g = ac.createGain();
        o.type = type || 'sine';
        o.connect(g);
        g.connect(ac.destination);
        var now = ac.currentTime;
        o.frequency.setValueAtTime(f1, now);
        o.frequency.exponentialRampToValueAtTime(f2, now + dur);
        g.gain.setValueAtTime(0.22, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + dur);
        o.start(now);
        o.stop(now + dur);
      } catch (e) {}
    }

    function initStars() {
      stars = [];
      for (var i = 0; i < 35; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.8 + 0.5,
          a: Math.random()
        });
      }
    }

    function resize() {
      w = c.width = window.innerWidth || 360;
      h = c.height = window.innerHeight || 640;
      initStars();
    }
    window.onresize = resize;
    resize();

    function updateCombo(val) {
      combo = val;
      var mult = Math.min(4, 1 + Math.floor(combo / 4));
      if (mult > 1) {
        comboVal.textContent = mult;
        comboBox.className = 'pill show';
      } else {
        comboBox.className = 'pill';
      }
      return mult;
    }

    function spawn() {
      var cfg = cfgMap[mode];
      var r = Math.random();
      var kind = 'norm';
      if (r < cfg.bomb) kind = 'bomb';
      else if (r < cfg.bomb + 0.09) kind = 'gold';
      else if (r < cfg.bomb + 0.15) kind = 'ice';

      var rad = kind === 'gold' ? 25 : (Math.random() * 16 + 26);
      var x = Math.random() * Math.max(30, w - rad * 2) + rad;
      var spd = (Math.random() * 1.8 + 2.1) * cfg.spd * (kind === 'gold' ? 1.25 : 1);
      var pal = pals[Math.floor(Math.random() * pals.length)];
      var pts = kind === 'bomb' ? -5 : (kind === 'gold' ? 5 : (kind === 'ice' ? 2 : (rad < 32 ? 2 : 1)));

      items.push({
        x: x, baseX: x, y: h + rad, rad: rad, spd: spd,
        c1: pal[0], c2: pal[1], pts: pts, kind: kind,
        phase: Math.random() * 6.28
      });
    }

    function addText(x, y, str, col) {
      texts.push({ x: x, y: y, str: str, col: col, a: 1 });
    }

    function boom(x, y, col) {
      for (var k = 0; k < 14; k++) {
        var a = Math.random() * 6.28;
        var s = Math.random() * 5 + 1.5;
        parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: Math.random() * 4 + 2, col: col, a: 1 });
      }
    }

    c.onpointerdown = function(e) {
      if (!playing) return;
      var rect = c.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      var hit = false;

      for (var i = items.length - 1; i >= 0; i--) {
        var it = items[i];
        if (Math.hypot(x - it.x, y - it.y) <= it.rad + 14) {
          hit = true;
          if (it.kind === 'bomb') {
            updateCombo(0);
            score = Math.max(0, score - 5);
            shake = 14;
            beep(150, 40, 0.25, 'sawtooth');
            vibro('err');
            boom(it.x, it.y, '#ef4444');
            addText(it.x, it.y, '-5', '#ef4444');
          } else {
            var mult = updateCombo(combo + 1);
