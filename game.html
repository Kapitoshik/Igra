<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Лопни шарики DELUXE</title>
  <script src="https://max.ru" defer></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 5; }
    .pill { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); padding: 8px 14px; border-radius: 14px; font-size: 16px; font-weight: 700; }
    #comboBox { color: #ffca3a; border-color: rgba(255,202,58,0.4); opacity: 0; transition: 0.2s; }
    #comboBox.show { opacity: 1; transform: scale(1.05); }
    #soundBtn { pointer-events: auto; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.15); color: #fff; width: 42px; height: 42px; border-radius: 50%; font-size: 18px; }
    #overlay { position: absolute; inset: 0; z-index: 20; background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    h1 { margin: 0 0 8px; font-size: 30px; color: #60a5fa; }
    .badge { background: rgba(255,202,58,0.15); color: #ffca3a; border: 1px solid rgba(255,202,58,0.35); padding: 6px 18px; border-radius: 20px; margin-bottom: 14px; font-weight: 700; }
    .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 340px; margin-bottom: 20px; }
    .tag { background: rgba(255,255,255,0.08); padding: 6px 10px; border-radius: 10px; font-size: 13px; color: #cbd5e1; }
    .row { display: flex; gap: 8px; margin-bottom: 22px; }
    .diff { background: rgba(255,255,255,0.08); color: #94a3b8; border: 2px solid transparent; padding: 10px 14px; border-radius: 12px; font-weight: 600; }
    .diff.active { background: rgba(59,130,246,0.25); border-color: #3b82f6; color: #fff; }
    #startBtn { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; border: none; padding: 16px 46px; font-size: 18px; font-weight: 700; border-radius: 16px; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="pill">💎 <span id="score">0</span></div>
    <div class="pill" id="comboBox">🔥 x<span id="comboVal">1</span></div>
    <div class="pill" id="timePill">⏱ <span id="time">30</span>с</div>
    <button id="soundBtn" type="button">🔊</button>
  </div>
  <canvas id="c"></canvas>
  <div id="overlay">
    <h1 id="title">Лопни шарики</h1>
    <div class="badge">🏆 Рекорд: <span id="best">0</span></div>
    <div class="legend" id="sub">
      <div class="tag">🎈 Шар +1/+2</div>
      <div class="tag">⭐ Золотой +5</div>
      <div class="tag">❄️ Лёд +3с</div>
      <div class="tag">💣 Бомба -5</div>
    </div>
    <div class="row">
      <button type="button" class="diff" data-d="easy">Лёгкий</button>
      <button type="button" class="diff active" data-d="normal">Средний</button>
      <button type="button" class="diff" data-d="hard">Сложный</button>
    </div>
    <button id="startBtn" type="button">Играть</button>
  </div>
  <script>
    var tg = null;
    window.onload = function() {
      try { tg = window.WebApp; if (tg && tg.ready) tg.ready(); } catch (e) {}
    };
    function vibro(t) {
      try {
        if (!tg || !tg.HapticFeedback) return;
        if (t === 'err' || t === 'ok') tg.HapticFeedback.notificationOccurred(t === 'err' ? 'error' : 'success');
        else tg.HapticFeedback.impactOccurred(t);
      } catch (e) {}
    }

    var c = document.getElementById('c'), ctx = c.getContext('2d');
    var scoreEl = document.getElementById('score'), timeEl = document.getElementById('time');
    var timePill = document.getElementById('timePill'), bestEl = document.getElementById('best');
    var comboBox = document.getElementById('comboBox'), comboVal = document.getElementById('comboVal');
    var overlay = document.getElementById('overlay'), titleEl = document.getElementById('title');
    var subEl = document.getElementById('sub'), startBtn = document.getElementById('startBtn');
    var soundBtn = document.getElementById('soundBtn'), diffs = document.querySelectorAll('.diff');

    var w = 360, h = 640, items = [], parts = [], texts = [], stars = [];
    var score = 0, best = 0, time = 30, combo = 0, freeze = 0, shake = 0;
    var playing = false, timer = 0, iv = null, raf = null, sound = true, mode = 'normal';

    try { best = Number(localStorage.getItem('b_best')) || 0; } catch (e) {}
    bestEl.textContent = best;

    var cfgMap = { easy: { rate: 25, spd: 0.85, bomb: 0.1 }, normal: { rate: 19, spd: 1.2, bomb: 0.18 }, hard: { rate: 14, spd: 1.6, bomb: 0.27 } };
    var pals = [['#ff758f','#c9184a'], ['#4cc9f0','#4361ee'], ['#80ed99','#38b000'], ['#f72585','#7209b7'], ['#ff9e00','#ff5400']];

    for (var i = 0; i < diffs.length; i++) {
      diffs[i].onclick = function() {
        for (var j = 0; j < diffs.length; j++) diffs[j].className = 'diff';
        this.className = 'diff active';
        mode = this.getAttribute('data-d');
      };
    }
    soundBtn.onclick = function() { sound = !sound; soundBtn.textContent = sound ? '🔊' : '🔇'; };

    var ac = null;
    function beep(f1, f2, dur, type) {
      if (!sound) return;
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!ac) ac = new AC();
        if (ac.state === 'suspended') ac.resume();
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = type || 'sine'; o.connect(g); g.connect(ac.destination);
        var now = ac.currentTime;
        o.frequency.setValueAtTime(f1, now);
        o.frequency.exponentialRampToValueAtTime(f2, now + dur);
        g.gain.setValueAtTime(0.22, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + dur);
        o.start(now); o.stop(now + dur);
      } catch (e) {}
    }

    function resize() {
      w = c.width = window.innerWidth || 360;
      h = c.height = window.innerHeight || 640;
      stars = [];
      for (var i = 0; i < 30; i++) stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.8 + 0.5, a: Math.random() });
    }
    window.onresize = resize;
    resize();

    function setCombo(v) {
      combo = v;
      var m = Math.min(4, 1 + Math.floor(combo / 4));
      comboVal.textContent = m;
      comboBox.className = m > 1 ? 'pill show' : 'pill';
      return m;
    }

    function spawn() {
      var cfg = cfgMap[mode], r = Math.random();
      var kind = r < cfg.bomb ? 'bomb' : (r < cfg.bomb + 0.09 ? 'gold' : (r < cfg.bomb + 0.15 ? 'ice' : 'norm'));
      var rad = kind === 'gold' ? 25 : (Math.random() * 16 + 26);
      var x = Math.random() * Math.max(30, w - rad * 2) + rad;
      var spd = (Math.random() * 1.8 + 2.1) * cfg.spd * (kind === 'gold' ? 1.25 : 1);
      var pal = pals[Math.floor(Math.random() * pals.length)];
      var pts = kind === 'bomb' ? -5 : (kind === 'gold' ? 5 : (kind === 'ice' ? 2 : (rad < 32 ? 2 : 1)));
      items.push({ x: x, bx: x, y: h + rad, rad: rad, spd: spd, c1: pal, c2: pal, pts: pts, kind: kind, ph: Math.random() * 6.28 });
    }

    function boom(x, y, col) {
      for (var k = 0; k < 12; k++) {
        var a = Math.random() * 6.28, s = Math.random() * 5 + 1.5;
        parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: Math.random() * 4 + 2, col: col, a: 1 });
      }
    }

    c.onpointerdown = function(e) {
      if (!playing) return;
      var rect = c.getBoundingClientRect(), x = e.clientX - rect.left, y = e.clientY - rect.top, hit = false;
      for (var i = items.length - 1; i >= 0; i--) {
        var it = items[i];
        if (Math.hypot(x - it.x, y - it.y) <= it.rad + 14) {
          hit = true;
          if (it.kind === 'bomb') {
            setCombo(0); score = Math.max(0, score - 5); shake = 14;
            beep(150, 40, 0.25, 'sawtooth'); vibro('err'); boom(it.x, it.y, '#ef4444');
            texts.push({ x: it.x, y: it.y, str: '-5', col: '#ef4444', a: 1 });
          } else {
            var add = it.pts * setCombo(combo + 1);
            score += add;
            if (it.kind === 'gold') {
              beep(520, 880, 0.18, 'triangle'); vibro('medium'); boom(it.x, it.y, '#ffca3a');
              texts.push({ x: it.x, y: it.y, str: '+' + add + ' ⭐', col: '#ffca3a', a: 1 });
            } else if (it.kind === 'ice') {
              freeze = 240; time += 3; timeEl.textContent = String(time);
              beep(600, 950, 0.2, 'sine'); vibro('medium'); boom(it.x, it.y, '#38bdf8');
              texts.push({ x: it.x, y: it.y, str: '+3с ❄️', col: '#38bdf8', a: 1 });
            } else {
              beep(340 + combo * 15, 680 + combo * 15, 0.1, 'sine'); vibro('light'); boom(it.x, it.y, it.c1);
              texts.push({ x: it.x, y: it.y, str: '+' + add, col: '#fff', a: 1 });
            }
          }
          scoreEl.textContent = String(score);
          items.splice(i, 1);
          break;
        }
      }
      if (!hit) setCombo(0);
    };
    function loop() {
      if (!playing) return;
      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake = shake < 0.5 ? 0 : shake * 0.85;
      }
      var bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, freeze > 0 ? '#0c2d48' : '#111827');
      bg.addColorStop(1, '#090d16');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

      for (var s = 0; s < stars.length; s++) {
        var st = stars[s]; st.a += 0.02;
        ctx.globalAlpha = 0.2 + Math.abs(Math.sin(st.a)) * 0.5;
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.28); ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (freeze > 0) { freeze--; timePill.style.borderColor = '#38bdf8'; }
      else timePill.style.borderColor = 'rgba(255,255,255,0.15)';

      var slow = freeze > 0 ? 0.45 : 1;
      timer++;
      if (timer > cfgMap[mode].rate / slow) { spawn(); timer = 0; }

      for (var i = items.length - 1; i >= 0; i--) {
        var it = items[i];
        it.y -= it.spd * slow; it.ph += 0.04; it.x = it.bx + Math.sin(it.ph) * 14;
        var g = ctx.createRadialGradient(it.x - it.rad * 0.3, it.y - it.rad * 0.3, it.rad * 0.1, it.x, it.y, it.rad);
var colA = String(it.c1).split(',')[0];
var colB = String(it.c1).split(',')[1] || colA;
g.addColorStop(0, it.kind === 'bomb' ? '#475569' : (it.kind === 'gold' ? '#fef08a' : (it.kind === 'ice' ? '#bae6fd' : colA)));
g.addColorStop(1, it.kind === 'bomb' ? '#0f172a' : (it.kind === 'gold' ? '#d97706' : (it.kind === 'ice' ? '#0284c7' : colB)));

        ctx.beginPath(); ctx.arc(it.x, it.y, it.rad, 0, 6.28); ctx.fillStyle = g; ctx.fill();

        if (it.kind === 'bomb') {
          ctx.lineWidth = 3; ctx.strokeStyle = '#ef4444'; ctx.stroke();
          ctx.font = Math.round(it.rad) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('💣', it.x, it.y + 2);
        } else {
          ctx.beginPath(); ctx.ellipse(it.x - it.rad * 0.32, it.y - it.rad * 0.32, it.rad * 0.24, it.rad * 0.14, -0.7, 0, 6.28);
          ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
          if (it.kind === 'gold' || it.kind === 'ice') {
            ctx.font = Math.round(it.rad * 0.9) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(it.kind === 'gold' ? '⭐' : '❄️', it.x, it.y + 2);
          }
        }
        if (it.y + it.rad < 0) items.splice(i, 1);
      }

      for (var j = parts.length - 1; j >= 0; j--) {
        var p = parts[j]; p.x += p.vx; p.y += p.vy; p.a -= 0.035;
        if (p.a <= 0) parts.splice(j, 1);
        else { ctx.globalAlpha = p.a; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fillStyle = p.col; ctx.fill(); }
      }
      for (var k = texts.length - 1; k >= 0; k--) {
        var tx = texts[k]; tx.y -= 1.8; tx.a -= 0.025;
        if (tx.a <= 0) texts.splice(k, 1);
        else { ctx.globalAlpha = tx.a; ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = tx.col; ctx.textAlign = 'center'; ctx.fillText(tx.str, tx.x, tx.y); }
      }
      ctx.restore();
      raf = requestAnimationFrame(loop);
    }

    startBtn.onclick = function() {
      resize(); score = 0; time = 30; items = []; parts = []; texts = []; timer = 0; freeze = 0; shake = 0;
      setCombo(0); scoreEl.textContent = '0'; timeEl.textContent = '30'; playing = true; overlay.style.display = 'none';
      if (iv) clearInterval(iv); if (raf) cancelAnimationFrame(raf);
      iv = setInterval(function() {
        time--; timeEl.textContent = String(time);
        if (time <= 0) {
          playing = false; clearInterval(iv); cancelAnimationFrame(raf);
          beep(440, 880, 0.35, 'triangle'); vibro('ok');
          var isRec = false;
          if (score > best) { best = score; try { localStorage.setItem('b_best', String(best)); } catch (e) {} bestEl.textContent = best; isRec = true; }
          titleEl.textContent = isRec ? 'Новый рекорд! 🎉' : 'Время вышло!';
          subEl.innerHTML = '<div class="tag" style="font-size:16px;color:#fff">Ваш счёт: <b>' + score + '</b> очков</div>';
          startBtn.textContent = 'Сыграть ещё'; overlay.style.display = 'flex';
        }
      }, 1000);
      loop();
    };
  </script>
</body>
</html>
