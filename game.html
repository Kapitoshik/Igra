<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Лопни шарики ULTRA</title>
  <script src="https://max.ru" defer></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 5; gap: 6px; }
    .pill { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); padding: 7px 12px; border-radius: 12px; font-size: 15px; font-weight: 700; }
    #comboBox { color: #ffca3a; border-color: rgba(255,202,58,0.5); opacity: 0; transition: 0.2s; }
    #comboBox.show { opacity: 1; transform: scale(1.06); }
    #soundBtn { pointer-events: auto; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.18); color: #fff; width: 38px; height: 38px; border-radius: 50%; font-size: 16px; }
    #overlay { position: absolute; inset: 0; z-index: 20; background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; }
    h1 { margin: 0 0 6px; font-size: 28px; color: #60a5fa; }
    .stats { display: flex; gap: 10px; margin-bottom: 14px; }
    .badge { background: rgba(255,202,58,0.15); color: #ffca3a; border: 1px solid rgba(255,202,58,0.35); padding: 5px 14px; border-radius: 16px; font-weight: 700; font-size: 14px; }
    .sec-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
    .btn-opt { background: rgba(255,255,255,0.08); color: #cbd5e1; border: 2px solid transparent; padding: 9px 14px; border-radius: 11px; font-weight: 600; font-size: 14px; }
    .btn-opt.active { background: rgba(59,130,246,0.28); border-color: #3b82f6; color: #fff; }
    .shop-btn { background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.4); color: #e9d5ff; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; }
    .shop-btn.owned { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.4); color: #bbf7d0; }
    .shop-btn.equipped { border: 2px solid #22c55e; color: #fff; }
    #startBtn { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; border: none; padding: 15px 46px; font-size: 18px; font-weight: 700; border-radius: 15px; margin-top: 6px; box-shadow: 0 6px 20px rgba(37,99,235,0.45); }
  </style>
</head>
<body>
  <div id="hud">
    <div class="pill">💎 <span id="score">0</span></div>
    <div class="pill" id="comboBox">🔥 x<span id="comboVal">1</span></div>
    <div class="pill" id="statusPill">⏱ 30с</div>
    <button id="soundBtn" type="button">🔊</button>
  </div>
  <canvas id="c"></canvas>
  <div id="overlay">
    <h1 id="title">Лопни шарики ULTRA</h1>
    <div class="stats">
      <div class="badge">🏆 Рекорд: <span id="best">0</span></div>
      <div class="badge">💰 Монеты: <span id="coins">0</span></div>
    </div>
    <div class="sec-title">Режим игры</div>
    <div class="row" id="modeRow">
      <button type="button" class="btn-opt active" data-m="time">⏱ На время</button>
      <button type="button" class="btn-opt" data-m="surv">❤️ Выживание</button>
    </div>
    <div class="sec-title">Сложность</div>
    <div class="row" id="diffRow">
      <button type="button" class="btn-opt" data-d="easy">Лёгкий</button>
      <button type="button" class="btn-opt active" data-d="normal">Средний</button>
      <button type="button" class="btn-opt" data-d="hard">Сложный</button>
    </div>
    <div class="sec-title">Магазин фонов (за монеты)</div>
    <div class="row" id="shopRow">
      <button type="button" class="shop-btn" data-id="space">🌌 Космос</button>
      <button type="button" class="shop-btn" data-id="ocean">🌊 Океан</button>
      <button type="button" class="shop-btn" data-id="sunset">🌅 Закат</button>
    </div>
    <button id="startBtn" type="button">Играть</button>
  </div>
  <script>
    var tg = null;
    window.onload = function() { try { tg = window.WebApp; if (tg && tg.ready) tg.ready(); } catch (e) {} };
    function vibro(t) {
      try {
        if (!tg || !tg.HapticFeedback) return;
        if (t === 'err' || t === 'ok') tg.HapticFeedback.notificationOccurred(t === 'err' ? 'error' : 'success');
        else tg.HapticFeedback.impactOccurred(t);
      } catch (e) {}
    }

    var c = document.getElementById('c'), ctx = c.getContext('2d');
    var scoreEl = document.getElementById('score'), statusPill = document.getElementById('statusPill');
    var bestEl = document.getElementById('best'), coinsEl = document.getElementById('coins');
    var comboBox = document.getElementById('comboBox'), comboVal = document.getElementById('comboVal');
    var overlay = document.getElementById('overlay'), titleEl = document.getElementById('title');
    var startBtn = document.getElementById('startBtn'), soundBtn = document.getElementById('soundBtn');

    var w = 360, h = 640, items = [], parts = [], texts = [], stars = [];
    var score = 0, best = 0, coins = 0, time = 30, lives = 3, combo = 0, freeze = 0, shake = 0;
    var playing = false, timer = 0, bossSpawned = false, iv = null, raf = null, sound = true;
    var diff = 'normal', gameMode = 'time', activeTheme = 'space';
    var ownedOcean = false, ownedSunset = false;

    try {
      best = Number(localStorage.getItem('u_best')) || 0;
      coins = Number(localStorage.getItem('u_coins')) || 0;
      activeTheme = localStorage.getItem('u_theme') || 'space';
      ownedOcean = localStorage.getItem('u_ocean') === '1';
      ownedSunset = localStorage.getItem('u_sunset') === '1';
    } catch (e) {}

    function saveData() {
      try {
        localStorage.setItem('u_best', String(best));
        localStorage.setItem('u_coins', String(coins));
        localStorage.setItem('u_theme', activeTheme);
        localStorage.setItem('u_ocean', ownedOcean ? '1' : '0');
        localStorage.setItem('u_sunset', ownedSunset ? '1' : '0');
      } catch (e) {}
    }

    function renderShop() {
      bestEl.textContent = String(best);
      coinsEl.textContent = String(coins);
      var btns = document.querySelectorAll('#shopRow .shop-btn');
      btns.forEach(function(btn) {
        var id = btn.getAttribute('data-id');
        if (id === 'space') {
          btn.className = activeTheme === 'space' ? 'shop-btn owned equipped' : 'shop-btn owned';
          btn.textContent = activeTheme === 'space' ? '🌌 Космос ✓' : '🌌 Космос';
        } else if (id === 'ocean') {
          if (ownedOcean) {
            btn.className = activeTheme === 'ocean' ? 'shop-btn owned equipped' : 'shop-btn owned';
            btn.textContent = activeTheme === 'ocean' ? '🌊 Океан ✓' : '🌊 Океан';
          } else {
            btn.className = 'shop-btn';
            btn.textContent = '🌊 Океан (150💰)';
          }
        } else if (id === 'sunset') {
          if (ownedSunset) {
            btn.className = activeTheme === 'sunset' ? 'shop-btn owned equipped' : 'shop-btn owned';
            btn.textContent = activeTheme === 'sunset' ? '🌅 Закат ✓' : '🌅 Закат';
          } else {
            btn.className = 'shop-btn';
            btn.textContent = '🌅 Закат (300💰)';
          }
        }
      });
    }

    document.querySelectorAll('#shopRow .shop-btn').forEach(function(btn) {
      btn.onclick = function() {
        var id = this.getAttribute('data-id');
        if (id === 'space') { activeTheme = 'space'; saveData(); renderShop(); }
        else if (id === 'ocean') {
          if (ownedOcean) { activeTheme = 'ocean'; saveData(); renderShop(); }
          else if (coins >= 150) { coins -= 150; ownedOcean = true; activeTheme = 'ocean'; saveData(); renderShop(); beep(500, 900, 0.2, 'triangle'); }
          else vibro('err');
        } else if (id === 'sunset') {
          if (ownedSunset) { activeTheme = 'sunset'; saveData(); renderShop(); }
          else if (coins >= 300) { coins -= 300; ownedSunset = true; activeTheme = 'sunset'; saveData(); renderShop(); beep(500, 900, 0.2, 'triangle'); }
          else vibro('err');
        }
      };
    });
    renderShop();

    document.querySelectorAll('#modeRow .btn-opt').forEach(function(btn) {
      btn.onclick = function() {
        document.querySelectorAll('#modeRow .btn-opt').forEach(function(b) { b.className = 'btn-opt'; });
        this.className = 'btn-opt active';
        gameMode = this.getAttribute('data-m');
      };
    });

    document.querySelectorAll('#diffRow .btn-opt').forEach(function(btn) {
      btn.onclick = function() {
        document.querySelectorAll('#diffRow .btn-opt').forEach(function(b) { b.className = 'btn-opt'; });
        this.className = 'btn-opt active';
        diff = this.getAttribute('data-d');
      };
    });

    soundBtn.onclick = function() { sound = !sound; soundBtn.textContent = sound ? '🔊' : '🔇'; };

    var ac = null;
    function beep(f1, f2, dur, type) {
      if (!sound) return;
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!ac) ac = new AC();
        if (ac.state === 'suspended') ac.resume();
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = type || 'sine'; o.connect(g); g.connect(ac.destination);
        var now = ac.currentTime;
        o.frequency.setValueAtTime(f1, now);
        o.frequency.exponentialRampToValueAtTime(f2, now + dur);
        g.gain.setValueAtTime(0.2, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + dur);
        o.start(now); o.stop(now + dur);
      } catch (e) {}
    }

    function resize() {
      w = c.width = window.innerWidth || 360;
      h = c.height = window.innerHeight || 640;
      stars = [];
      for (var i = 0; i < 30; i++) stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.8 + 0.5, a: Math.random() });
    }
    window.onresize = resize;
    resize();

    function setCombo(v) {
      combo = v;
      var m = Math.min(4, 1 + Math.floor(combo / 4));
      comboVal.textContent = String(m);
      comboBox.className = m > 1 ? 'pill show' : 'pill';
      return m;
    }

    function updateStatus() {
      if (gameMode === 'time') statusPill.textContent = '⏱ ' + time + 'с';
      else statusPill.textContent = lives === 3 ? '❤️❤️❤️' : (lives === 2 ? '❤️❤️' : (lives === 1 ? '❤️' : '💔'));
    }

    function pickColors() {
      var n = Math.floor(Math.random() * 5);
      if (n === 0) return { a: '#ff758f', b: '#c9184a' };
      if (n === 1) return { a: '#4cc9f0', b: '#4361ee' };
      if (n === 2) return { a: '#80ed99', b: '#38b000' };
      if (n === 3) return { a: '#f72585', b: '#7209b7' };
      return { a: '#ff9e00', b: '#ff5400' };
    }

    function spawn(isBoss) {
      if (isBoss) {
        items.push({ x: w / 2, bx: w / 2, y: h + 65, rad: 62, spd: 0.65, c1: '#e11d48', c2: '#4c0519', pts: 50, kind: 'boss', hp: 12, ph: 0 });
        return;
      }
      var rateSpd = diff === 'easy' ? 0.85 : (diff === 'hard' ? 1.5 : 1.15);
      var bombCh = diff === 'easy' ? 0.10 : (diff === 'hard' ? 0.25 : 0.17);
      var r = Math.random();
      var kind = r < bombCh ? 'bomb' : (r < bombCh + 0.09 ? 'gold' : (r < bombCh + 0.15 ? 'ice' : 'norm'));
      var rad = kind === 'gold' ? 25 : (Math.random() * 15 + 26);
      var x = Math.random() * Math.max(30, w - rad * 2) + rad;
      var spd = (Math.random() * 1.6 + 2.0) * rateSpd * (kind === 'gold' ? 1.25 : 1);
      var pal = pickColors();
      var pts = kind === 'bomb' ? -5 : (kind === 'gold' ? 5 : (kind === 'ice' ? 2 : (rad < 32 ? 2 : 1)));
      items.push({ x: x, bx: x, y: h + rad, rad: rad, spd: spd, c1: pal.a, c2: pal.b, pts: pts, kind: kind, hp: 1, ph: Math.random() * 6.28 });
    }

    function boom(x, y, col) {
      for (var k = 0; k < 12; k++) {
        var a = Math.random() * 6.28, s = Math.random() * 5 + 1.5;
        parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: Math.random() * 4 + 2, col: col, a: 1 });
      }
    }
    c.onpointerdown = function(e) {
      if (!playing) return;
      var rect = c.getBoundingClientRect(), x = e.clientX - rect.left, y = e.clientY - rect.top, hit = false;
      var remaining = [];
      for (var i = 0; i < items.length; i++) {
        var it = items.shift();
        items.push(it);
      }
      items.forEach(function(it) {
        if (!hit && Math.hypot(x - it.x, y - it.y) <= it.rad + 14) {
          hit = true;
          if (it.kind === 'boss') {
            it.hp--;
            it.rad = Math.max(42, it.rad - 1.2);
            beep(220 + (12 - it.hp) * 30, 350, 0.08, 'square');
            vibro('light');
            boom(x, y, '#fb7185');
            if (it.hp <= 0) {
              var bonus = 50 * setCombo(combo + 1);
              score += bonus; shake = 16;
              beep(400, 950, 0.3, 'triangle'); vibro('ok');
              boom(it.x, it.y, '#ffca3a');
              texts.push({ x: it.x, y: it.y, str: 'БОСС +' + bonus + '👑', col: '#ffca3a', a: 1 });
            } else {
              remaining.push(it);
            }
          } else if (it.kind === 'bomb') {
            setCombo(0); score = Math.max(0, score - 5); shake = 14;
            beep(150, 40, 0.25, 'sawtooth'); vibro('err'); boom(it.x, it.y, '#ef4444');
            texts.push({ x: it.x, y: it.y, str: '-5', col: '#ef4444', a: 1 });
            if (gameMode === 'surv') {
              lives--; updateStatus();
              if (lives <= 0) { scoreEl.textContent = String(score); finishGame(); }
            }
          } else {
            var add = it.pts * setCombo(combo + 1);
            score += add;
            if (it.kind === 'gold') {
              beep(520, 880, 0.18, 'triangle'); vibro('medium'); boom(it.x, it.y, '#ffca3a');
              texts.push({ x: it.x, y: it.y, str: '+' + add + ' ⭐', col: '#ffca3a', a: 1 });
            } else if (it.kind === 'ice') {
              freeze = 240;
              if (gameMode === 'time') { time += 3; updateStatus(); }
              beep(600, 950, 0.2, 'sine'); vibro('medium'); boom(it.x, it.y, '#38bdf8');
              texts.push({ x: it.x, y: it.y, str: '❄️ ЗАМОРОЗКА', col: '#38bdf8', a: 1 });
            } else {
              beep(340 + combo * 15, 680 + combo * 15, 0.1, 'sine'); vibro('light'); boom(it.x, it.y, it.c1);
              texts.push({ x: it.x, y: it.y, str: '+' + add, col: '#fff', a: 1 });
            }
          }
          scoreEl.textContent = String(score);
        } else {
          remaining.push(it);
        }
      });
      items = remaining;
      if (!hit) setCombo(0);
    };

    function finishGame() {
      playing = false;
      if (iv) clearInterval(iv);
      if (raf) cancelAnimationFrame(raf);
      beep(440, 880, 0.35, 'triangle');
      vibro('ok');
      coins += score;
      var isRec = false;
      if (score > best) { best = score; isRec = true; }
      saveData();
      renderShop();
      titleEl.textContent = isRec ? 'Новый рекорд: ' + score + '! 🎉' : 'Счёт за игру: ' + score;
      startBtn.textContent = 'Сыграть ещё';
      overlay.style.display = 'flex';
    }

    function loop() {
      if (!playing) return;
      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake = shake < 0.5 ? 0 : shake * 0.85;
      }

      var topCol = activeTheme === 'ocean' ? '#0369a1' : (activeTheme === 'sunset' ? '#7c2d12' : '#111827');
      var botCol = activeTheme === 'ocean' ? '#082f49' : (activeTheme === 'sunset' ? '#1e1b4b' : '#090d16');
      var bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, freeze > 0 ? '#0c2d48' : topCol);
      bg.addColorStop(1, botCol);
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

      stars.forEach(function(st) {
        st.a += 0.02;
        ctx.globalAlpha = 0.2 + Math.abs(Math.sin(st.a)) * 0.5;
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.28); ctx.fill();
      });
      ctx.globalAlpha = 1;

      if (freeze > 0) { freeze--; statusPill.style.borderColor = '#38bdf8'; }
      else statusPill.style.borderColor = 'rgba(255,255,255,0.18)';

      var spawnRate = diff === 'easy' ? 26 : (diff === 'hard' ? 15 : 20);
      var slow = freeze > 0 ? 0.45 : 1;
      timer++;
      if (timer > spawnRate / slow) { spawn(false); timer = 0; }
      if (!bossSpawned && score >= 40) { bossSpawned = true; spawn(true); }

      var nextItems = [];
      items.forEach(function(it) {
        it.y -= it.spd * slow; it.ph += 0.04;
        it.x = it.kind === 'boss' ? w / 2 + Math.sin(it.ph * 0.6) * 40 : it.bx + Math.sin(it.ph) * 14;

        var g = ctx.createRadialGradient(it.x - it.rad * 0.3, it.y - it.rad * 0.3, it.rad * 0.1, it.x, it.y, it.rad);
        g.addColorStop(0, it.kind === 'bomb' ? '#475569' : (it.kind === 'gold' ? '#fef08a' : (it.kind === 'ice' ? '#bae6fd' : it.c1)));
        g.addColorStop(1, it.kind === 'bomb' ? '#0f172a' : (it.kind === 'gold' ? '#d97706' : (it.kind === 'ice' ? '#0284c7' : it.c2)));
        ctx.beginPath(); ctx.arc(it.x, it.y, it.rad, 0, 6.28); ctx.fillStyle = g; ctx.fill();

        if (it.kind === 'boss') {
          ctx.lineWidth = 4; ctx.strokeStyle = '#ffca3a'; ctx.stroke();
          ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('👑 ' + it.hp, it.x, it.y);
        } else if (it.kind === 'bomb') {
          ctx.lineWidth = 3; ctx.strokeStyle = '#ef4444'; ctx.stroke();
          ctx.font = Math.round(it.rad) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('💣', it.x, it.y + 2);
        } else {
          ctx.beginPath(); ctx.ellipse(it.x - it.rad * 0.32, it.y - it.rad * 0.32, it.rad * 0.24, it.rad * 0.14, -0.7, 0, 6.28);
          ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
          if (it.kind === 'gold' || it.kind === 'ice') {
            ctx.font = Math.round(it.rad * 0.9) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(it.kind === 'gold' ? '⭐' : '❄️', it.x, it.y + 2);
          }
        }

        if (it.y + it.rad < 0) {
          if (gameMode === 'surv' && (it.kind === 'norm' || it.kind === 'gold')) {
            lives--; updateStatus(); setCombo(0); shake = 10;
            if (lives <= 0 && playing) { finishGame(); }
          }
        } else {
          nextItems.push(it);
        }
      });
      items = nextItems;

      var nextParts = [];
      parts.forEach(function(p) {
        p.x += p.vx; p.y += p.vy; p.a -= 0.035;
        if (p.a > 0) {
          ctx.globalAlpha = p.a; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fillStyle = p.col; ctx.fill();
          nextParts.push(p);
        }
      });
      parts = nextParts;

      var nextTexts = [];
      texts.forEach(function(tx) {
        tx.y -= 1.8; tx.a -= 0.025;
        if (tx.a > 0) {
          ctx.globalAlpha = tx.a; ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = tx.col; ctx.textAlign = 'center'; ctx.fillText(tx.str, tx.x, tx.y);
          nextTexts.push(tx);
        }
      });
      texts = nextTexts;

      ctx.restore();
      if (playing) raf = requestAnimationFrame(loop);
    }

    startBtn.onclick = function() {
      resize(); score = 0; time = 30; lives = 3; items = []; parts = []; texts = [];
      timer = 0; freeze = 0; shake = 0; bossSpawned = false;
      setCombo(0); scoreEl.textContent = '0'; updateStatus();
      playing = true; overlay.style.display = 'none';
      if (iv) clearInterval(iv); if (raf) cancelAnimationFrame(raf);
      if (gameMode === 'time') {
        iv = setInterval(function() {
          time--; updateStatus();
          if (time <= 0) finishGame();
        }, 1000);
      }
      loop();
    };
  </script>
</body>
</html>
