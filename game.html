<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Лопни шарики</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f1322; font-family: sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 700; pointer-events: none; z-index: 5; }
    #soundBtn { pointer-events: auto; background: rgba(255,255,255,0.15); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; }
    #overlay { position: absolute; inset: 0; z-index: 20; background: rgba(15,19,34,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    h1 { margin: 0 0 10px; font-size: 28px; }
    .badge { background: rgba(255,202,58,0.2); color: #ffca3a; padding: 6px 16px; border-radius: 20px; margin-bottom: 14px; font-weight: 700; }
    p { margin: 0 0 20px; color: #a0aec0; max-width: 300px; }
    .row { display: flex; gap: 8px; margin-bottom: 24px; }
    .diff { background: rgba(255,255,255,0.1); color: #cbd5e1; border: 2px solid transparent; padding: 10px 14px; border-radius: 10px; font-weight: 600; }
    .diff.active { background: rgba(59,130,246,0.3); border-color: #3b82f6; color: #fff; }
    #startBtn { background: #3b82f6; color: #fff; border: none; padding: 16px 44px; font-size: 18px; font-weight: 700; border-radius: 14px; }
  </style>
</head>
<body>
  <div id="hud">
    <div>Счёт: <span id="score">0</span></div>
    <div>Время: <span id="time">30</span>с</div>
    <button id="soundBtn" type="button">🔊</button>
  </div>
  <canvas id="c"></canvas>
  <div id="overlay">
    <h1 id="title">Лопни шарики</h1>
    <div class="badge">Рекорд: <span id="best">0</span></div>
    <p id="sub">Лопай шары (+1/+2), звёзды (+5) и избегай бомб (-5)!</p>
    <div class="row">
      <button type="button" class="diff" data-d="easy">Лёгкий</button>
      <button type="button" class="diff active" data-d="normal">Средний</button>
      <button type="button" class="diff" data-d="hard">Сложный</button>
    </div>
    <button id="startBtn" type="button">Играть</button>
  </div>

  <script>
    var c = document.getElementById('c');
    var ctx = c.getContext('2d');
    var scoreEl = document.getElementById('score');
    var timeEl = document.getElementById('time');
    var bestEl = document.getElementById('best');
    var overlay = document.getElementById('overlay');
    var titleEl = document.getElementById('title');
    var subEl = document.getElementById('sub');
    var startBtn = document.getElementById('startBtn');
    var soundBtn = document.getElementById('soundBtn');
    var diffs = document.querySelectorAll('.diff');

    var w = 360, h = 640, items = [], parts = [], score = 0, best = 0, time = 30;
    var playing = false, timer = 0, iv = null, raf = null, sound = true, mode = 'normal';

    try { best = Number(localStorage.getItem('b_best')) || 0; } catch (e) {}
    bestEl.textContent = best;

    var cfgMap = {
      easy: { rate: 26, spd: 0.8, bomb: 0.1 },
      normal: { rate: 20, spd: 1.15, bomb: 0.18 },
      hard: { rate: 14, spd: 1.55, bomb: 0.28 }
    };
    var cols = ['#ff595e', '#8ac926', '#1982c4', '#6a4c93', '#ff758f'];

    for (var i = 0; i < diffs.length; i++) {
      diffs[i].onclick = function() {
        for (var j = 0; j < diffs.length; j++) diffs[j].className = 'diff';
        this.className = 'diff active';
        mode = this.getAttribute('data-d');
      };
    }

    soundBtn.onclick = function() {
      sound = !sound;
      soundBtn.textContent = sound ? '🔊' : '🔇';
    };

    var ac = null;
    function beep(freq, dur) {
      if (!sound) return;
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!ac) ac = new AC();
        if (ac.state === 'suspended') ac.resume();
        var o = ac.createOscillator();
        var g = ac.createGain();
        o.connect(g);
        g.connect(ac.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.2, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, ac.currentTime + dur);
        o.start();
        o.stop(ac.currentTime + dur);
      } catch (e) {}
    }

    function resize() {
      w = c.width = window.innerWidth || 360;
      h = c.height = window.innerHeight || 640;
    }
    window.onresize = resize;
    resize();

    function spawn() {
      var cfg = cfgMap[mode];
      var r = Math.random();
      var kind = r < cfg.bomb ? 'bomb' : (r < cfg.bomb + 0.1 ? 'gold' : 'norm');
      var rad = kind === 'gold' ? 24 : (Math.random() * 18 + 25);
      var x = Math.random() * Math.max(20, w - rad * 2) + rad;
      var spd = (Math.random() * 2 + 2) * cfg.spd;
      var col = kind === 'bomb' ? '#1e293b' : (kind === 'gold' ? '#ffca3a' : cols[Math.floor(Math.random() * cols.length)]);
      var pts = kind === 'bomb' ? -5 : (kind === 'gold' ? 5 : (rad < 31 ? 2 : 1));
      items.push({ x: x, y: h + rad, rad: rad, spd: spd, col: col, pts: pts, kind: kind });
    }

    c.onpointerdown = function(e) {
      if (!playing) return;
      var rect = c.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      for (var i = items.length - 1; i >= 0; i--) {
        var it = items[i];
        if (Math.hypot(x - it.x, y - it.y) <= it.rad + 14) {
          score = Math.max(0, score + it.pts);
          scoreEl.textContent = score;
          beep(it.kind === 'bomb' ? 120 : (it.kind === 'gold' ? 750 : 480), 0.12);
          for (var k = 0; k < 10; k++) {
            var a = Math.random() * 6.28;
            var s = Math.random() * 4 + 1;
            parts.push({ x: it.x, y: it.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, col: it.col, a: 1 });
          }
          items.splice(i, 1);
          break;
        }
      }
    };

    function loop() {
      if (!playing) return;
      ctx.clearRect(0, 0, w, h);
      timer++;
      if (timer > cfgMap[mode].rate) { spawn(); timer = 0; }

      for (var i = items.length - 1; i >= 0; i--) {
        var it = items[i];
        it.y -= it.spd;
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.rad, 0, 6.28);
        ctx.fillStyle = it.col;
        ctx.fill();
        if (it.kind === 'bomb') {
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#ef4444';
          ctx.stroke();
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 18px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('-5', it.x, it.y);
        } else if (it.kind === 'gold') {
          ctx.fillStyle = '#000';
          ctx.font = 'bold 18px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('+5', it.x, it.y);
        }
        if (it.y + it.rad < 0) items.splice(i, 1);
      }

      for (var j = parts.length - 1; j >= 0; j--) {
        var p = parts[j];
        p.x += p.vx;
        p.y += p.vy;
        p.a -= 0.04;
        if (p.a <= 0) { parts.splice(j, 1); }
        else {
          ctx.globalAlpha = p.a;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, 6.28);
          ctx.fillStyle = p.col;
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
      raf = requestAnimationFrame(loop);
    }

    startBtn.onclick = function() {
      resize();
      score = 0; time = 30; items = []; parts = []; timer = 0;
      scoreEl.textContent = '0';
      timeEl.textContent = '30';
      playing = true;
      overlay.style.display = 'none';
      if (iv) clearInterval(iv);
      if (raf) cancelAnimationFrame(raf);
      iv = setInterval(function() {
        time--;
        timeEl.textContent = String(time);
        if (time <= 0) {
          playing = false;
          clearInterval(iv);
          cancelAnimationFrame(raf);
          beep(600, 0.3);
          if (score > best) {
            best = score;
            try { localStorage.setItem('b_best', String(best)); } catch (e) {}
            bestEl.textContent = best;
            titleEl.textContent = 'Новый рекорд!';
          } else {
            titleEl.textContent = 'Время вышло!';
          }
          subEl.textContent = 'Результат: ' + score;
          startBtn.textContent = 'Ещё раз';
          overlay.style.display = 'flex';
        }
      }, 1000);
      loop();
    };
  </script>
</body>
</html>
