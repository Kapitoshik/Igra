<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Лопни шарики PRO — MAX Mini App</title>
  <script src="https://max.ru"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #1a1f36 0%, #0f1322 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: 700;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    #soundBtn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 19, 34, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }
    .record-badge {
      background: rgba(255, 202, 58, 0.15);
      color: #ffca3a;
      border: 1px solid rgba(255, 202, 58, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    p {
      margin: 0 0 20px;
      font-size: 16px;
      color: #a0aec0;
      max-width: 320px;
      line-height: 1.4;
    }
    .difficulty-group {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .diff-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      border: 2px solid transparent;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
    }
    .diff-btn.active {
      background: rgba(59, 130, 246, 0.25);
      border-color: #3b82f6;
      color: #ffffff;
    }
    #startBtn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 16px 42px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body>

  <div id="hud">
    <div>Счёт: <span id="score">0</span></div>
    <div>Время: <span id="time">30</span>с</div>
    <button id="soundBtn" title="Звук">🔊</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="overlay">
    <h1 id="title">Лопни шарики</h1>
    <div class="record-badge">🏆 Рекорд: <span id="bestScore">0</span></div>
    <p id="subtitle">Лопай цветные шары (+1/+2), золотые (+5) и избегай бомб (-5)!</p>
    
    <div class="difficulty-group" id="diffGroup">
      <button class="diff-btn" data-diff="easy">Лёгкий</button>
      <button class="diff-btn active" data-diff="normal">Средний</button>
      <button class="diff-btn" data-diff="hard">Сложный</button>
    </div>

    <button id="startBtn">Играть</button>
  </div>

  <script>
    // Безопасная инициализация MAX WebApp
    let tg = null;
    try {
      tg = window.WebApp || null;
      if (tg && typeof tg.ready === 'function') {
        tg.ready();
      }
      if (tg && typeof tg.enableClosingConfirmation === 'function') {
        tg.enableClosingConfirmation();
      }
    } catch (err) {
      console.warn('MAX WebApp init warning:', err);
    }

    // Безопасное чтение и запись рекорда
    function getSavedScore() {
      try {
        return parseInt(localStorage.getItem('bubble_best_score')) || 0;
      } catch (e) {
        return 0;
      }
    }

    function setSavedScore(val) {
      try {
        localStorage.setItem('bubble_best_score', String(val));
      } catch (e) {}
    }

    function triggerHaptic(type) {
      try {
        if (!tg || !tg.HapticFeedback) return;
        if (type === 'error' && tg.HapticFeedback.notificationOccurred) {
          tg.HapticFeedback.notificationOccurred('error');
        } else if (type === 'success' && tg.HapticFeedback.notificationOccurred) {
          tg.HapticFeedback.notificationOccurred('success');
        } else if (tg.HapticFeedback.impactOccurred) {
          tg.HapticFeedback.impactOccurred(type);
        }
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const bestScoreEl = document.getElementById('bestScore');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const startBtn = document.getElementById('startBtn');
    const soundBtn = document.getElementById('soundBtn');
    const diffButtons = document.querySelectorAll('.diff-btn');

    let width, height;
    let items = [];
    let particles = [];
    let floatingTexts = [];
    let score = 0;
    let bestScore = getSavedScore();
    let timeLeft = 30;
    let isPlaying = false;
    let spawnTimer = 0;
    let gameInterval;
    let soundEnabled = true;
    let currentDiff = 'normal';

    bestScoreEl.textContent = bestScore;

    const difficulties = {
      easy: { spawnRate: 26, speedMult: 0.8, bombChance: 0.10 },
      normal: { spawnRate: 20, speedMult: 1.15, bombChance: 0.18 },
      hard: { spawnRate: 14, speedMult: 1.55, bombChance: 0.28 }
    };

    const colors = ['#ff595e', '#8ac926', '#1982c4', '#6a4c93', '#ff758f'];

    diffButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        diffButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentDiff = btn.dataset.diff;
      });
    });

    let audioCtx = null;
    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'pop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(680, now + 0.09);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === 'gold') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.setValueAtTime(780, now + 0.07);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'bomb') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.28);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === 'end') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(554, now + 0.12);
          osc.frequency.setValueAtTime(659, now + 0.24);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        }
      } catch (e) {}
    }

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    });

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function spawnItem() {
      const cfg = difficulties[currentDiff];
      const rand = Math.random();
      let type = 'normal';

      if (rand < cfg.bombChance) {
        type = 'bomb';
      } else if (rand < cfg.bombChance + 0.10) {
        type = 'gold';
      }

      const radius = type === 'gold' ? 24 : (Math.random() * 18 + 25);
      const x = Math.random() * (width - radius * 2) + radius;
      const y = height + radius;
      const baseSpeed = Math.random() * 2 + 2 + (30 - timeLeft) * 0.06;
      const speed = baseSpeed * cfg.speedMult * (type === 'gold' ? 1.3 : 1);

      let color = colors[Math.floor(Math.random() * colors.length)];
      let points = radius < 31 ? 2 : 1;

      if (type === 'bomb') {
        color = '#1e293b';
        points = -5;
      } else if (type === 'gold') {
        color = '#ffca3a';
        points = 5;
      }

      items.push({ x, y, radius, speed, color, points, type });
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4.5 + 1;
        particles.push({
          x, y,
