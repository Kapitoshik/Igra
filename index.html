<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Лопни шарики — MAX Mini App</title>
  <!-- Подключаем официальный SDK мессенджера MAX -->
  <script src="https://max.ru"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #1a1f36 0%, #0f1322 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: 700;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 19, 34, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }
    p {
      margin: 0 0 24px;
      font-size: 18px;
      color: #a0aec0;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
      transition: transform 0.1s;
    }
    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div id="hud">
    <div>Счёт: <span id="score">0</span></div>
    <div>Время: <span id="time">30</span>с</div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="overlay">
    <h1 id="title">Лопни шарики</h1>
    <p id="subtitle">Нажимай на шарики, чтобы набрать максимум очков за 30 секунд!</p>
    <button id="startBtn">Играть</button>
  </div>

  <script>
    // 1. Инициализация MAX WebApp
    const tg = window.WebApp;
    if (tg) {
      tg.ready(); // Сообщаем мессенджеру, что приложение загрузилось
      if (tg.enableClosingConfirmation) {
        tg.enableClosingConfirmation(); // Защита от случайного закрытия свайпом
      }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const startBtn = document.getElementById('startBtn');

    let width, height;
    let bubbles = [];
    let particles = [];
    let score = 0;
    let timeLeft = 30;
    let isPlaying = false;
    let spawnTimer = 0;
    let gameInterval;

    const colors = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#ff758f'];

    // Подстройка размера холста под экран смартфона
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Создание нового шарика
    function spawnBubble() {
      const radius = Math.random() * 22 + 24; // Радиус от 24 до 46 px
      const x = Math.random() * (width - radius * 2) + radius;
      const y = height + radius;
      const speed = Math.random() * 2.5 + 2 + (30 - timeLeft) * 0.08; // Ускорение к концу игры
      const color = colors[Math.floor(Math.random() * colors.length)];
      const points = radius < 32 ? 2 : 1; // Маленькие шарики дают 2 очка

      bubbles.push({ x, y, radius, speed, color, points });
    }

    // Эффект брызг при лопании
    function createExplosion(x, y, color) {
      for (let i = 0; i < 10; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 4 + 2,
          color,
          alpha: 1
        });
      }
    }

    // Обработка нажатий (тач и клик)
    function handleInput(e) {
      if (!isPlaying) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      // Проверяем попадание с конца массива (верхние шарики в приоритете)
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        const dist = Math.hypot(x - b.x, y - b.y);
        
        if (dist <= b.radius + 8) { // +8px для удобства попадания пальцем
          score += b.points;
          scoreEl.textContent = score;
          createExplosion(b.x, b.y, b.color);
          bubbles.splice(i, 1);

          // Вибрация через MAX Bridge API
          if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('light');
          }
          break;
        }
      }
    }

    canvas.addEventListener('touchstart', handleInput, { passive: true });
    canvas.addEventListener('mousedown', handleInput);

    // Игровой цикл
    function update() {
      if (!isPlaying) return;
      ctx.clearRect(0, 0, width, height);

      // Спавн шариков
      spawnTimer++;
      if (spawnTimer > 22) {
        spawnBubble();
        spawnTimer = 0;
      }

      // Отрисовка и движение шариков
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.y -= b.speed;

        // Рисуем сам шарик
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        // Рисуем блик на шарике
        ctx.beginPath();
        ctx.arc(b.x - b.radius * 0.3, b.y - b.radius * 0.3, b.radius * 0.22, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.fill();

        // Удаляем улетевшие за экран
        if (b.y + b.radius < 0) {
          bubbles.splice(i, 1);
        }
      }

      // Отрисовка частиц (брызг)
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.04;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
          ctx.restore();
        }
      }

      requestAnimationFrame(update);
    }

    // Запуск игры
    function startGame() {
      score = 0;
      timeLeft = 30;
      bubbles = [];
      particles = [];
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      isPlaying = true;
      overlay.style.display = 'none';

      clearInterval(gameInterval);
      gameInterval = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      update();
    }

    // Конец игры
    function endGame() {
      isPlaying = false;
      clearInterval(gameInterval);
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
      titleEl.textContent = 'Время вышло!';
      subtitleEl.textContent = `Ваш результат: ${score} очков`;
      startBtn.textContent = 'Сыграть ещё';
      overlay.style.display = 'flex';
    }

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
